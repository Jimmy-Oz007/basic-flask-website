{% extends "base.html" %}

{% block content %}

<h1>Contact Me</h1>

{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <p class="success">

                {{ message }}

            </p>

        {% endfor %}

    {% endif %}

{% endwith %}

<form method="POST">

    <label>Name</label>

    <input type="text"
           name="name"
           required>

    <label>Email</label>

    <input type="email"
           name="email"
           required>

    <label>Message</label>

    <textarea name="message"
              required></textarea>

    <button type="submit">

        Send Message

    </button>

</form>

{% endblock %}
